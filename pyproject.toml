[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nzgd_map"
authors = [{ name = "QuakeCoRE" }]
description = "An interactive website for exploring extracted NZGD data"
readme = "readme.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    'flask>=3.1',
    'numpy>=1.26',
    'pandas>=2.2',
    'plotly>=5.24',
    'werkzeug>=3.1',
]

[project.optional-dependencies]
test = ['pytest>=8', 'pytest-cov>=5', 'ruff']

[tool.setuptools.packages]
find = { include = ["nzgd_map*"] }

[tool.setuptools.package-data]
nzgd_map = ['templates/*.html', 'templates/views/*.html', 'static/*']

[tool.deptry]
optional_dependencies_dev_groups = ["test"]

[tool.ruff.lint]
extend-select = [
    # isort imports
    "I",
    # Use r'\s+' rather than '\s+'
    "W605",
    # All the naming errors, like using camel case for function names.
    "N",
    # Missing docstrings in classes, methods, and functions
    "D101",
    "D102",
    "D103",
    "D105",
    "D107",
    # Use f-string instead of a format call
    "UP032",
    # Standard library import is deprecated
    "UP035",
    # Missing function argument type-annotation
    "ANN001",
    # Using except without specifying an exception type to catch
    "BLE001",
]
ignore = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
    "source_modelling",
    "workflow",
    "pygmt_helper",
    "qcore",
    "empirical",
    "nshmdb",
    "IM_calculation",
    "mera",
]

[tool.ruff.lint.per-file-ignores]
# Ignore no docstring in __init__.py
"__init__.py" = ["D104"]
# Ignore docstring errors in tests folder
"tests/**.py" = ["D"]
