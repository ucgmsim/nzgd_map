[uwsgi]
module = nzgd_map.wsgi
callable = app
master = true
processes = 5
enable-threads = true
need-app = true
single-interpreter = true

socket = /tmp/nzgd.sock
chmod-socket = 660
uid = nobody
gid = www-data
vacuum = true
die-on-term = true

# Requests forwarded by reverse proxies can carry several KB of headers. uWSGI's
# default 4 KB buffer rejects larger requests, which nginx reports as 502.
# 65535 bytes is the uwsgi protocol's packet limit.
buffer-size = 65535

# nginx supplies SCRIPT_NAME=/nzgd and a normalized PATH_INFO. Strip the mount
# prefix before passing the request to Flask, as in the existing deployment.
route-run = fixpathinfo:
